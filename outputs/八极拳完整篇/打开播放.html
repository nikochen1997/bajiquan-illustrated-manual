<script>const v=document.querySelector('#movie'), c=document.querySelector('#chapter'), speed=document.querySelector('#speed');function step(d){v.pause();v.currentTime=Math.max(0,Math.min(Math.max(0,(v.duration||0)-1/24),v.currentTime+d/24))}c.onchange=()=>{v.src=c.value;v.load();v.playbackRate=Number(speed.value)};document.querySelector('#back').onclick=()=>step(-1);document.querySelector('#next').onclick=()=>step(1);document.querySelector('#toggle').onclick=()=>{if(v.paused)v.play();else v.pause()};speed.onchange=()=>v.playbackRate=Number(speed.value);v.ontimeupdate=()=>{document.querySelector('#time').textContent='第 '+Math.min(Math.max(1,Math.round((v.duration||0)*24)),Math.floor(v.currentTime*24)+1)+' 帧 · '+v.currentTime.toFixed(2)+' 秒'};document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(e.key==='ArrowLeft'){e.preventDefault();step(-1)}if(e.key==='ArrowRight'){e.preventDefault();step(1)}});</script></html>
